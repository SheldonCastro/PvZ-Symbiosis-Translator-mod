[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pvz-asset-extractor"
version = "0.1.0"
description = "Read-only Unity texture and sprite extraction for local translation workspaces"
requires-python = ">=3.11,<3.15"
dependencies = ["UnityPy==1.25.2", "Pillow==12.3.0"]

[project.scripts]
pvz-asset-extractor = "pvz_asset_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

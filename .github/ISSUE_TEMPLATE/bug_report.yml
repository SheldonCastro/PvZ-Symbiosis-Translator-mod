name: Bug report
description: Report a problem with the translator
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: mod
    attributes:
      label: Mod version
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game and MelonLoader versions
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Log excerpt or screenshot
      description: Remove personal paths and unrelated private data before attaching.

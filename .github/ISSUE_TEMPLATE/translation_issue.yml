name: Translation issue
description: Suggest a translation or correction
title: "[Translation] "
labels: ["translation"]
body:
  - type: input
    id: language
    attributes:
      label: Language pack
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source and current translation
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested translation
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Screen or context
      description: A screenshot helps with wording and layout.
    validations:
      required: true

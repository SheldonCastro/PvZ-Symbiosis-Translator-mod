name: Texture issue
description: Report an incorrect or missing localized image
title: "[Texture] "
labels: ["texture"]
body:
  - type: input
    id: screen
    attributes:
      label: Affected screen
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current result and screenshot
      description: Attach a screenshot, not an extracted game atlas.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
